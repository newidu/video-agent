name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax check
        run: npm test
      - name: Verify Windows-only package configuration
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($pkg.build.win.target.Count -lt 2) { throw "NSIS and portable targets must both be configured." }
